<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kūryba - Petras Budrys</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. HEADER PLACEHOLDER (MUST BE AT THE VERY TOP OF BODY) -->
  <div id="header-placeholder"></div>

  <!-- 2. MAIN CONTENT -->
  <main class="content-container">
    
    <section class="work-section">
      <h2 class="section-title">Tapyba</h2>
      <div class="image-grid">
        <img src="images/tapyba1.jpg" alt="Tapybos darbas 1" loading="lazy">
        <img src="images/tapyba2.jpg" alt="Tapybos darbas 2" loading="lazy">
        <img src="images/tapyba3.jpg" alt="Tapybos darbas 3" loading="lazy">
      </div>
    </section>

    <section class="work-section">
      <h2 class="section-title">Piešiniai</h2>
      <div class="image-grid">
        <img src="images/piesinys1.jpg" alt="Piešinys 1" loading="lazy">
        <img src="images/piesinys2.jpg" alt="Piešinys 2" loading="lazy">
      </div>
    </section>

  </main>

  <!-- 3. FOOTER PLACEHOLDER -->
  <div id="footer-placeholder"></div>

  <!-- 4. SCRIPT (LOADS HEADER & FOOTER) -->
  <script src="script.js"></script>
</body>
</html>
